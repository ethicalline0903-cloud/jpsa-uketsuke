<style>
/* レイアウト：スマホ1列のアプリ画面。黒の見出し帯、薄いグレーの地、操作はワインレッド。 */
:root {
  --bg: #f1f1f2; --surface: #ffffff; --ink: #1a1a1c; --muted: #64646a; --line: #dcdcdf;
  --head: #111113; --head-ink: #ffffff; --sat: #2f62a3;
  --brand: #7b1e33; --brand-ink: #ffffff; --accent: #a8762a; --soft: #f3e7ea;
  --ok: #1c7444; --ok-bg: #e2f2e8; --warn: #8f5a00; --warn-bg: #fbefd8; --danger: #b3261e; --danger-bg: #fbe4e1;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
  --f-display: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121214; --surface: #1c1c1f; --ink: #ececee; --muted: #9c9ca3; --line: #2e2e33;
  --head: #000000; --head-ink: #ececee; --sat: #7fa8e0;
  --brand: #d0687f; --brand-ink: #1a0a0f; --accent: #dcae5c; --soft: #2c1c21;
  --ok: #67cf93; --ok-bg: #173323; --warn: #e6ad48; --warn-bg: #352812; --danger: #f2877e; --danger-bg: #3a1c1a;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121214; --surface: #1c1c1f; --ink: #ececee; --muted: #9c9ca3; --line: #2e2e33;
  --head: #000000; --head-ink: #ececee; --sat: #7fa8e0;
  --brand: #d0687f; --brand-ink: #1a0a0f; --accent: #dcae5c; --soft: #2c1c21;
  --ok: #67cf93; --ok-bg: #173323; --warn: #e6ad48; --warn-bg: #352812; --danger: #f2877e; --danger-bg: #3a1c1a;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--head); }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--head); color: var(--head-ink); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
.brand-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line); flex: none; }
.brand { font-family: var(--f-display); font-size: 19px; font-weight: 700; letter-spacing: .06em; }
.brand small { display: block; font-family: var(--f-body); font-size: 11px; font-weight: 500; letter-spacing: .08em; opacity: .8; }
.who { background: transparent; color: var(--head-ink); border: 1px solid currentColor; border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; max-width: 50%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
main .wrap { padding-block: 20px 120px; display: grid; gap: 18px; }
h1, h2 { font-family: var(--f-display); font-weight: 700; text-wrap: balance; margin: 0; line-height: 1.4; }
h1 { font-size: 22px; } h2 { font-size: 18px; }
.label { font-size: 12px; letter-spacing: .1em; color: var(--muted); font-weight: 500; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.demo { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 12px 14px; font-size: 13px; display: grid; gap: 8px; }
.demo .row { display: flex; gap: 8px; flex-wrap: wrap; }

label.f { display: grid; gap: 4px; font-size: 13px; font-weight: 500; }
label.f .req { color: var(--danger); font-size: 11px; margin-left: 4px; }
input, select, textarea { font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
textarea { min-height: 120px; resize: vertical; line-height: 1.6; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 12px 16px; background: var(--brand); color: var(--brand-ink); cursor: pointer; text-align: center; }
.btn.sub { background: var(--soft); color: var(--brand); }
.btn.line { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.danger { background: var(--danger-bg); color: var(--danger); }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: wait; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns .btn { flex: 1 1 auto; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--soft); border-radius: 12px; padding: 4px; }
.seg button { font: inherit; font-weight: 700; border: 0; background: transparent; color: var(--muted); padding: 10px; border-radius: 9px; cursor: pointer; }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--brand); }
.err { color: var(--danger); font-size: 13px; min-height: 1em; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 420px) { .grid2 { grid-template-columns: 1fr; } }

/* 会員証 */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.card .band { background: var(--head); color: var(--head-ink); padding: 10px 18px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card .band b { font-family: var(--f-display); letter-spacing: .2em; font-size: 15px; }
.card .band span { font-family: var(--f-mono); font-size: 13px; letter-spacing: .08em; }
.card .body { padding: 20px 18px; display: grid; justify-items: center; gap: 12px; text-align: center; }
#qr { background: #ffffff; padding: 12px; border-radius: 10px; line-height: 0; }
#qr img, #qr canvas { width: 200px; height: 200px; }
.card .name { font-family: var(--f-display); font-size: 22px; font-weight: 700; }
.card .co { color: var(--muted); font-size: 13px; margin-top: -10px; }

/* セミナー */
.sem { display: grid; grid-template-columns: 58px 1fr; gap: 14px; align-items: start; }
.datebox { border: 1px solid var(--line); border-radius: 10px; text-align: center; padding: 6px 0; font-variant-numeric: tabular-nums; }
.datebox .m { font-size: 11px; color: var(--muted); display: block; }
.datebox .d { font-family: var(--f-display); font-size: 22px; font-weight: 700; display: block; line-height: 1.2; }
.datebox .w { font-size: 11px; color: var(--muted); }
.datebox.today { border-color: var(--accent); }
.sem .t { font-weight: 700; line-height: 1.5; }
.sem .meta { font-size: 13px; color: var(--muted); }
.info { white-space: pre-wrap; font-size: 14px; background: var(--bg); border-radius: 10px; padding: 12px; margin-top: 6px; overflow-wrap: anywhere; }
details summary { cursor: pointer; color: var(--brand); font-size: 13px; font-weight: 700; margin-top: 4px; }
.list { display: grid; gap: 16px; }
.list > * + * { border-top: 1px solid var(--line); padding-top: 16px; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--soft); color: var(--brand); margin-right: 6px; vertical-align: 1px; }
.pill.today { background: var(--accent); color: var(--surface); }

.cal-head { display: flex; align-items: center; justify-content: space-between; }
.cal-head button { font: inherit; font-size: 18px; background: var(--soft); color: var(--brand); border: 0; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-variant-numeric: tabular-nums; }
.cal .wd { font-size: 11px; color: var(--muted); padding-bottom: 2px; }
.cal .wd:first-child, .cal .sun { color: var(--danger); }
.cal .sat { color: var(--sat); }
.cal button { font: inherit; font-size: 14px; aspect-ratio: 1; max-width: 100%; border: 1px solid transparent; background: transparent; border-radius: 10px; cursor: pointer; color: inherit; position: relative; padding: 0; }
.cal button.out { color: var(--muted); opacity: .45; }
.cal button.is-today { border-color: var(--accent); }
.cal button.has { background: var(--brand); color: var(--brand-ink); font-weight: 700; }
.cal button.sel { outline: 2px solid var(--accent); outline-offset: 1px; }

/* 参加履歴 */
.hist { display: grid; grid-template-columns: 48px 1fr; gap: 14px; align-items: center; }
.stamp { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--danger); color: var(--danger); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 17px; transform: rotate(-8deg); }
.big { font-family: var(--f-display); font-size: 34px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1; }

/* 受付 */
#reader { width: 100%; border-radius: 12px; overflow: hidden; background: var(--bg); }
#reader video { border-radius: 12px; }
.result { border-radius: 12px; padding: 14px; font-weight: 700; display: grid; gap: 2px; }
.result.ok { background: var(--ok-bg); color: var(--ok); }
.result.already { background: var(--warn-bg); color: var(--warn); }
.result.error { background: var(--danger-bg); color: var(--danger); }
.result .sub { font-weight: 400; font-size: 13px; }
.count { display: flex; align-items: baseline; gap: 6px; }
.att { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; font-size: 14px; align-items: baseline; }
.att .tm { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.att .id { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.inline { display: flex; gap: 8px; }
.inline input { flex: 1; }
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
dl.prof { display: grid; grid-template-columns: 6em 1fr; gap: 6px 12px; margin: 0; font-size: 14px; }
dl.prof dt { color: var(--muted); } dl.prof dd { margin: 0; overflow-wrap: anywhere; }
.temp { font-family: var(--f-mono); font-size: 20px; letter-spacing: .08em; background: var(--bg); padding: 8px 12px; border-radius: 8px; user-select: all; }

/* タブ */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
nav.tabs button { font: inherit; font-size: 11px; font-weight: 500; border: 0; background: transparent; color: var(--muted); padding: 8px 2px 10px; cursor: pointer; display: grid; justify-items: center; gap: 2px; }
nav.tabs button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button[aria-current="page"] { color: var(--brand); font-weight: 700; }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
.loading { text-align: center; color: var(--muted); padding: 40px 0; }
@media (prefers-reduced-motion: no-preference) { .result, .toast { animation: pop .25s ease-out; } @keyframes pop { from { transform: translateY(6px); opacity: .4; } } .toast { animation-name: popc; } @keyframes popc { from { transform: translate(-50%, 6px); opacity: .4; } } }
</style>

<script>
/* ===== 共通 ===== */
const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
// ↓ Apps Script の「ウェブアプリURL」（…/exec で終わるもの）を '' の間に貼り付けます
const API_URL = 'https://script.google.com/macros/s/AKfycbzK7DIT81dLkze3rzWc6NuTZ2IwnP3FxU90VamEP-h5OPk_Zug1iJbs1d9JsOrGuSw/exec';
const USE_API = !IS_GAS && /^https:\/\/script\.google\.com\/.+\/exec$/.test(API_URL);
const LIVE = IS_GAS || USE_API;
const state = { token: null, user: null, history: [], seminars: [], tab: 'home', calMonth: null, selDay: null, recSeminar: null, editing: null };
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseYmd = (s) => { const t = String(s || ''); let m = t.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/); if (m) return new Date(+m[1], m[2] - 1, +m[3]); m = t.match(/^(\d{1,2})\D+(\d{1,2})/); if (m) return new Date(new Date().getFullYear(), m[1] - 1, +m[2]); return new Date(NaN); };
const todayStr = () => ymd(new Date());
const jp = (s, withYear) => { const d = parseYmd(s); if (isNaN(d)) return s; return (withYear ? d.getFullYear() + '年' : '') + (d.getMonth() + 1) + '月' + d.getDate() + '日(' + WD[d.getDay()] + ')'; };
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} } };

function call(name, p) {
  p = Object.assign({ token: state.token }, p || {});
  if (IS_GAS) {
    return new Promise((res, rej) => google.script.run
      .withSuccessHandler(res)
      .withFailureHandler((e) => rej(new Error((e && e.message) || String(e))))
      .api(name, p));
  }
  if (USE_API) {
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ name: name, p: p }) })
      .then((r) => r.json(), () => { throw new Error('通信できませんでした。電波の良い場所でもう一度お試しください'); })
      .then((r) => { if (!r.ok) throw new Error(r.error || 'エラーが発生しました'); return r.data; });
  }
  return new Promise((res, rej) => setTimeout(() => { try { res(JSON.parse(JSON.stringify(Demo.api(name, p)))); } catch (e) { rej(e); } }, 150));
}

let toastTimer;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600); }
async function busy(btn, fn) { if (btn) btn.disabled = true; try { return await fn(); } finally { if (btn) btn.disabled = false; } }
function handleAuthError(e) {
  if (/有効期限|会員情報が見つかりません/.test(e.message)) { logout(); toast(e.message); return true; }
  return false;
}

// iPhoneの写真は大きすぎて読み取れないことがあるので、縮小してから読む
function shrinkImage(file, max) {
  max = max || 1200;
  return new Promise((res) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      if (k === 1) { URL.revokeObjectURL(url); res(file); return; }
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob((b) => res(b ? new File([b], 'qr.jpg', { type: 'image/jpeg' }) : file), 'image/jpeg', 0.9);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}
async function startCam() {

  }
}
async function stopCam() {

async function onScan(text) {
  if (scanBusy) return; scanBusy = true;
  try { scanner.pause(true); } catch (e) {}

  setTimeout(() => { scanBusy = false; try { scanner && scanner.resume(); } catch (e) {} }, 2000);

      <p class="small" style="margin:0">管理者を増やすときは、スプレッドシートの「会員」シートで、その方の「権限」を「管理者」に変更してください（10名まで想定）。会員の一覧や受付記録もスプレッドシートで確認できます。</p>
    </section>`;
  $('sm-form').addEventListener('submit', (ev) => { ev.preventDefault(); saveSem(); });
  $('rp-form').addEventListener('submit', (ev) => { ev.preventDefault(); resetPw(); });
}
function editSem(id) { state.editing = state.seminars.find((s) => s.id === id); viewManage(); window.scrollTo(0, 0); }
function cancelEdit() { state.editing = null; viewManage(); }
async function saveSem() {
  $('sm-err').textContent = '';
  const seminar = { id: state.editing && state.editing.id, date: $('sm-date').value, time: $('sm-time').value, title: $('sm-title').value, place: $('sm-place').value, info: $('sm-info').value };
  await busy($('sm-btn'), async () => {
    try { await call('saveSeminar', { seminar }); state.seminars = await call('getSeminars'); toast(seminar.id ? '変更を保存しました' : 'セミナーを登録しました'); state.editing = null; viewManage(); }
    catch (e) { if (!handleAuthError(e)) $('sm-err').textContent = e.message; }
  });
}
async function delSem(id, btn) {
  if (!btn.dataset.confirm) { btn.dataset.confirm = '1'; btn.textContent = '本当に削除する'; setTimeout(() => { if (btn.isConnected) { delete btn.dataset.confirm; btn.textContent = '削除'; } }, 4000); return; }
  await busy(btn, async () => {
    try { await call('deleteSeminar', { id }); state.seminars = await call('getSeminars'); toast('削除しました'); viewManage(); }
    catch (e) { if (!handleAuthError(e)) toast(e.message); }
  });
}
async function resetPw() {
  await busy($('rp-btn'), async () => {
    try { const r = await call('resetPassword', { email: $('rp-email').value });
      $('rp-out').innerHTML = `<div class="small">${esc(r.name)} 様の仮パスワード</div><div class="temp">${esc(r.tempPassword)}</div>`; }
    catch (e) { if (!handleAuthError(e)) $('rp-out').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  });
}

const Demo = (() => {
  const day = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
  const stamp = (s, t) => s.replace(/-/g, '/') + ' ' + t;
  const members = [
    { id: 'M0001', name: '山田 花子', company: '株式会社やまだ', title: '代表取締役', job: '建設業', phone: '090-1111-2222', email: 'admin@example.com', hobby: '茶道', role: '管理者', pw: 'password123', qrKey: 'a1b2c3d4e5f6' },
    { id: 'M0002', name: '佐藤 太郎', company: '佐藤工務店', title: '営業部長', job: '住宅・リフォーム', phone: '080-3333-4444', email: 'taro@example.com', hobby: 'ゴルフ', role: '会員', pw: 'password123', qrKey: 'f6e5d4c3b2a1' },
    { id: 'M0003', name: '鈴木 一郎', company: 'すずき会計事務所', title: '所長', job: '税理士・会計', phone: '070-5555-6666', email: 'suzuki@example.com', hobby: '釣り', role: '会員', pw: 'password123', qrKey: '0f1e2d3c4b5a' }
  ];
  const seminars = [
    { id: 'S1', date: day(-28), time: '06:30', title: '経営者モーニングセミナー「朝の習慣が会社を変える」', place: 'ホテル会議室A', info: '講師：田中 誠 氏（株式会社たなか 代表）\n会費：朝食代 1,000円\n6:15より受付開始です。', updatedBy: '山田 花子', updatedAt: '' },
    { id: 'S2', date: day(0), time: '06:30', title: '経営者モーニングセミナー「人が育つ職場のつくり方」', place: 'ホテル会議室A', info: '講師：高橋 美和 氏（人材育成コンサルタント）\n会費：朝食代 1,000円\n持ち物：名刺、筆記用具\n駐車場はホテル地下（2時間無料）をご利用ください。', updatedBy: '山田 花子', updatedAt: '' },
    { id: 'S3', date: day(28), time: '06:30', title: '経営者モーニングセミナー「事業承継、いつから準備するか」', place: 'ホテル会議室B', info: '講師：鈴木 一郎 氏（すずき会計事務所 税理士）\n会場がいつもと異なります。ご注意ください。', updatedBy: '山田 花子', updatedAt: '' }
  ];
  const checkins = [
    { at: stamp(day(-28), '06:12'), seminarId: 'S1', date: day(-28), title: seminars[0].title, memberId: 'M0002', name: '佐藤 太郎', company: '佐藤工務店', staff: '山田 花子' },
    { at: stamp(day(-28), '06:18'), seminarId: 'S1', date: day(-28), title: seminars[0].title, memberId: 'M0003', name: '鈴木 一郎', company: 'すずき会計事務所', staff: '山田 花子' },
    { at: stamp(day(0), '06:10'), seminarId: 'S2', date: day(0), title: seminars[1].title, memberId: 'M0003', name: '鈴木 一郎', company: 'すずき会計事務所', staff: '山田 花子' }
  ];
  const sessions = {};
  const now = () => { const d = new Date(); return stamp(ymd(d), pad(d.getHours()) + ':' + pad(d.getMinutes())); };
  const obj = (m) => ({ id: m.id, name: m.name, company: m.company, title: m.title, job: m.job, phone: m.phone, email: m.email, hobby: m.hobby, isAdmin: m.role === '管理者', qr: m.id + '.' + m.qrKey });
  const auth = (p, admin) => { const m = members.find((x) => x.id === sessions[p.token]); if (!m) throw new Error('ログインの有効期限が切れました。もう一度ログインしてください'); if (admin && m.role !== '管理者') throw new Error('この操作は管理者のみ行えます'); return m; };
  const sess = (m) => { const t = Math.random().toString(36).slice(2) + Date.now(); sessions[t] = m.id; return t; };
  const sorted = () => seminars.slice().sort((a, b) => (a.date + a.time) < (b.date + b.time) ? -1 : 1);
  const H = {
    register(p) {
      const email = String(p.email || '').trim().toLowerCase();
      if (!String(p.name || '').trim() || !email) throw new Error('氏名とメールアドレスは必須です');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new Error('メールアドレスの形式が正しくありません');
      if (String(p.password || '').length < 8) throw new Error('パスワードは8文字以上にしてください');
      if (members.some((m) => m.email === email)) throw new Error('このメールアドレスはすでに登録されています');
      const m = { id: 'M' + pad4(members.length + 1), name: p.name.trim(), company: p.company, title: p.title, job: p.job, phone: p.phone, email, hobby: p.hobby, role: '会員', pw: p.password, qrKey: Math.random().toString(16).slice(2, 14) };
      members.push(m); return { token: sess(m), user: obj(m) };
    },
    login(p) { const m = members.find((x) => x.email === String(p.email || '').trim().toLowerCase()); if (!m || m.pw !== p.password) throw new Error('メールアドレスまたはパスワードが違います'); return { token: sess(m), user: obj(m) }; },
    me(p) { const m = auth(p); return { user: obj(m), history: checkins.filter((c) => c.memberId === m.id).map((c) => ({ date: c.date, title: c.title, at: c.at })).sort((a, b) => a.date < b.date ? 1 : -1) }; },
    changePassword(p) { const m = auth(p); if (m.pw !== p.current) throw new Error('現在のパスワードが違います'); if (String(p.next || '').length < 8) throw new Error('新しいパスワードは8文字以上にしてください'); m.pw = p.next; return { ok: true }; },
    getSeminars(p) { auth(p); return sorted(); },
    saveSeminar(p) {
      const a = auth(p, true), s = p.seminar || {};
      if (!/^\d{4}-\d{2}-\d{2}$/.test(s.date || '')) throw new Error('開催日を入力してください');
      if (!String(s.title || '').trim()) throw new Error('タイトルを入力してください');
      const rec = { id: s.id || 'S' + Date.now(), date: s.date, time: s.time, title: s.title.trim(), place: s.place, info: s.info, updatedBy: a.name, updatedAt: now() };
      const i = seminars.findIndex((x) => x.id === s.id); if (i >= 0) seminars[i] = rec; else seminars.push(rec); return rec;
    },
    deleteSeminar(p) { auth(p, true); const i = seminars.findIndex((x) => x.id === p.id); if (i < 0) throw new Error('セミナーが見つかりません'); seminars.splice(i, 1); return { ok: true }; },
    checkin(p) {
      const a = auth(p, true), parts = String(p.code || '').trim().split('.'), id = parts[0].toUpperCase();
      const m = members.find((x) => x.id === id); if (!m) throw new Error('会員が見つかりません（' + p.code + '）');
      if (!p.manual && parts[1] !== m.qrKey) throw new Error('QRコードが正しくありません');
      const s = seminars.find((x) => x.id === p.seminarId); if (!s) throw new Error('受付するセミナーを選んでください');
      const info = { name: m.name, company: m.company, id };
      if (checkins.some((c) => c.seminarId === s.id && c.memberId === id)) return { status: 'already', member: info };
      checkins.push({ at: now(), seminarId: s.id, date: s.date, title: s.title, memberId: id, name: m.name, company: m.company, staff: a.name });
      return { status: 'ok', member: info };
    },
    attendees(p) { auth(p, true); return checkins.filter((c) => c.seminarId === p.seminarId).map((c) => ({ at: c.at, id: c.memberId, name: c.name, company: c.company })).sort((a, b) => a.at < b.at ? 1 : -1); },
    resetPassword(p) { auth(p, true); const m = members.find((x) => x.email === String(p.email || '').trim().toLowerCase()); if (!m) throw new Error('そのメールアドレスの会員は見つかりません'); m.pw = Math.random().toString(36).slice(2, 10); return { name: m.name, tempPassword: m.pw }; }
  };
  function pad4(n) { return String(n).padStart(4, '0'); }
  return { api(name, p) { const fn = H[name]; if (!fn) throw new Error('不明な操作です'); return fn(p); } };
})();
